# ============================================================
#  Catégorie "Nourritures" - réglages du menu
#  title         : titre (%page% et %pages% disponibles ; codes couleur, MiniMessage, glyph Nexo)
#  rows          : nombre de lignes du menu (1 à 6)
#  content-slots : (optionnel) slots où les items sont placés automatiquement.
#                  Exemples : "10-16, 19-25"  ou  [10, 11, 12]
#                  Par défaut : tous les slots sauf la dernière ligne (réservée à la navigation).
#  items         : boutons / décorations. Actions : CLOSE, MAIN, BACK, PREVIOUS_PAGE, NEXT_PAGE.
#                  PREVIOUS_PAGE / NEXT_PAGE sont masqués quand il n'y a pas de page à atteindre.
#  Les items à vendre sont dans les autres fichiers .yml de ce dossier (items.yml).
# ============================================================
title: "&8Shop &7» &6Nourritures &8(&7%page%&8/&7%pages%&8)"
rows: 3
# content-slots non défini : les 18 premiers slots sont utilisés (dernière ligne = navigation)

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  previous:
    slot: 21
    material: ARROW
    name: "&e« Page précédente &7(%page%/%pages%)"
    action: PREVIOUS_PAGE
  back:
    slot: 22
    material: BARRIER
    name: "&cRetour"
    action: MAIN
  next:
    slot: 23
    material: ARROW
    name: "&ePage suivante » &7(%page%/%pages%)"
    action: NEXT_PAGE
