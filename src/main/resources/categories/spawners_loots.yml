# ============================================================
#  Spawners & loots
#  Les spawners sont donnés par commande (RoseStacker) : aucun item physique n'est vendu/repris.
#  Syntaxe RoseStacker : /rs give spawner <joueur> <type> <quantité>
# ============================================================
title: "&8Shop &7» &5Spawners &d& Loots"
rows: 6

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  back:
    slot: 49
    material: ARROW
    name: "&cRetour"
    action: MAIN

shop-items:
  # ----- Spawners (commandes) -----
  spawner_zombie:
    slot: 10
    material: SPAWNER
    name: "&2Spawner &aZombie"
    lore:
      - "&7Génère des zombies."
      - ""
      - "%buy_line%"
      - "%sell_line%"
    buy-price: 25000
    commands:
      - "rs give spawner %player% zombie %amount%"
  spawner_skeleton:
    slot: 11
    material: SPAWNER
    name: "&7Spawner &fSquelette"
    buy-price: 30000
    commands:
      - "rs give spawner %player% skeleton %amount%"
  spawner_spider:
    slot: 12
    material: SPAWNER
    name: "&8Spawner &cAraignée"
    buy-price: 28000
    commands:
      - "rs give spawner %player% spider %amount%"
  spawner_blaze:
    slot: 13
    material: SPAWNER
    name: "&6Spawner &eBlaze"
    buy-price: 60000
    commands:
      - "rs give spawner %player% blaze %amount%"
  spawner_iron_golem:
    slot: 14
    material: SPAWNER
    name: "&fSpawner &bGolem de fer"
    buy-price: 120000
    commands:
      - "rs give spawner %player% iron_golem %amount%"

  # ----- Loots (items physiques) -----
  bone:          { slot: 28, material: BONE, name: "&fOs", buy-price: 12, sell-price: 4 }
  rotten_flesh:  { slot: 29, material: ROTTEN_FLESH, name: "&cChair putréfiée", buy-price: 8, sell-price: 2 }
  string:        { slot: 30, material: STRING, name: "&fFicelle", buy-price: 10, sell-price: 3 }
  gunpowder:     { slot: 31, material: GUNPOWDER, name: "&8Poudre à canon", buy-price: 20, sell-price: 6 }
  ender_pearl:   { slot: 32, material: ENDER_PEARL, name: "&5Perle d'Ender", buy-price: 60, sell-price: 18 }
  blaze_rod:     { slot: 33, material: BLAZE_ROD, name: "&6Bâton de blaze", buy-price: 50, sell-price: 15 }
  iron_loot:     { slot: 34, material: IRON_INGOT, name: "&fLingot de fer (loot)", sell-price: 10 }
