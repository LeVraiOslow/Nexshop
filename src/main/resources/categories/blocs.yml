# ============================================================
#  Catégorie : Blocs
#  Champs d'un item (shop-items) :
#    slot / slots      : emplacement(s)
#    material          : item réel acheté/vendu (STONE ou nexo:mon_item)
#    display-material  : (optionnel) autre item pour l'affichage
#    name / lore       : (optionnels) nom et description (codes couleur partout)
#                        lore par défaut = default-item-lore de config.yml
#    buy-price         : prix d'achat  (absent ou négatif = non achetable)
#    sell-price        : prix de vente (absent ou négatif = non vendable)
#    buyable / sellable: false pour forcer la désactivation
#    commands          : commandes exécutées à l'achat (console par défaut, "[player] ..." possible)
#                        placeholders : %player% %amount%
#    give-item         : donner l'item physique ? (défaut : false si "commands" est défini)
#    commands-per-unit : true = exécuter les commandes une fois par unité achetée
#    custom-model-data, glow, hide-flags, amount
# ============================================================
title: "&8Shop &7» &aBlocs"
# title: "<glyph:shop_blocs>"   # exemple Nexo
rows: 6

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  back:
    slot: 49
    material: ARROW
    name: "&cRetour"
    action: MAIN

shop-items:
  stone:
    slot: 10
    material: STONE
    name: "&fPierre"
    lore:
      - "&7Un bloc de base."
      - ""
      - "%buy_line%"
      - "%sell_line%"
    buy-price: 5
    sell-price: 1
  cobblestone: { slot: 11, material: COBBLESTONE, name: "&7Pierre taillée", buy-price: 3, sell-price: 0.5 }
  deepslate:   { slot: 12, material: DEEPSLATE, name: "&8Ardoise des abîmes", buy-price: 6, sell-price: 1 }
  dirt:        { slot: 13, material: DIRT, name: "&6Terre", buy-price: 2, sell-price: 0.25 }
  sand:        { slot: 14, material: SAND, name: "&eSable", buy-price: 4, sell-price: 0.5 }
  gravel:      { slot: 15, material: GRAVEL, name: "&7Gravier", buy-price: 4, sell-price: 0.5 }
  oak_log:     { slot: 16, material: OAK_LOG, name: "&6Bûche de chêne", buy-price: 8, sell-price: 2 }
  glass:       { slot: 19, material: GLASS, name: "&bVerre", buy-price: 6, sell-price: 1 }
  bricks:      { slot: 20, material: BRICKS, name: "&cBriques", buy-price: 12, sell-price: 3 }
  sandstone:   { slot: 21, material: SANDSTONE, name: "&eGrès", buy-price: 8, sell-price: 1.5 }
  quartz:      { slot: 22, material: QUARTZ_BLOCK, name: "&fBloc de quartz", buy-price: 40, sell-price: 10 }
  obsidian:    { slot: 23, material: OBSIDIAN, name: "&5Obsidienne", buy-price: 120, sell-price: 25 }
  glowstone:   { slot: 24, material: GLOWSTONE, name: "&eGlowstone", buy-price: 30 }                 # achat uniquement
  bedrock_like: { slot: 25, material: CRYING_OBSIDIAN, name: "&dObsidienne pleureuse", sell-price: 30 } # vente uniquement
  # Exemple item Nexo :
  # ruby_block: { slot: 28, material: "nexo:ruby_block", buy-price: 500, sell-price: 100 }
