# Tous les messages supportent les codes couleur (&a, &#RRGGBB, MiniMessage).
# Placeholders : %prefix% et ceux indiqués pour chaque message.
prefix: "&8[&6Shop&8] &r"

no-permission: "%prefix%&cVous n'avez pas la permission."
player-only: "%prefix%&cCette commande est réservée aux joueurs."
reloaded: "%prefix%&aConfiguration rechargée."
unknown-category: "%prefix%&cCatégorie introuvable."
economy-unavailable: "%prefix%&cAucune économie (Vault / EssentialsX) n'est disponible."
item-unavailable: "%prefix%&cL'item &e%item% &cest indisponible pour le moment."
transaction-failed: "%prefix%&cLa transaction a échoué."

not-buyable: "%prefix%&cL'item &e%item% &cn'est pas achetable."
not-sellable: "%prefix%&cL'item &e%item% &cn'est pas vendable."

# %price% %balance% %item%
not-enough-money: "%prefix%&cVous n'avez pas assez d'argent ! &7(Prix : &e%price%&7, solde : &e%balance%&7)"
# %have% %item% %amount%
not-enough-items: "%prefix%&cVous n'avez pas assez de &e%item% &c! &7(Vous en possédez &e%have%&7)"
# %max% = quantité maximale achetable avec la place disponible
not-enough-space: "%prefix%&cPas assez de place dans votre inventaire ! Quantité maximale achetable : &e%max%"
inventory-full: "%prefix%&cVotre inventaire est plein."

# %amount% %item% %total%
bought: "%prefix%&aVous avez acheté &e%amount%x %item% &apour &e%total%&a."
sold: "%prefix%&aVous avez vendu &e%amount%x %item% &apour &e%total%&a."

# Mots utilisés dans les menus (%mode%)
mode-buy: "Acheter"
mode-sell: "Vendre"
